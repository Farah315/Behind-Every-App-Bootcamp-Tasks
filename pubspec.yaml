name: products_page_app
description: "Flutter Bootcamp Final Project - Products Page with pagination, search & category filtering"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.3+1

  # Images
  cached_network_image: ^3.3.1

  # Debounce transformer for the BLoC search event stream
  stream_transform: ^2.1.0

  # Masonry grid — sizes each card to its real content height
  # instead of forcing a fixed aspect ratio (fixes the empty gap
  # under short cards)
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
